name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Verify app
        run: |
          npm run typecheck
          npm test
          npx expo install --check

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build Galaxy-compatible release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk VOCA-QUEST-android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOCA-QUEST-Android-APK
          path: VOCA-QUEST-android-arm64.apk
          if-no-files-found: error
          retention-days: 30
